name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      # The compiled binary must start and read a repository (codesign is macOS only, so not `bun run build`).
      - run: bun run compile --outfile dist/graft && ./dist/graft list --json
